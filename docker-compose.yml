# ─────────────────────────────────────────────────────────────────────────────
# WMS-2026 — Docker Compose
# Env vars loaded automatically from .env file in the same directory.
# ─────────────────────────────────────────────────────────────────────────────

services:
  wms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: .env
    environment:
      - AUTH_TRUST_HOST=1
    depends_on:
      wms-db:
        condition: service_healthy

  wms-db:
    image: mysql:8.0
    container_name: wms-db
    restart: always
    env_file: .env
    volumes:
      - wms_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  wms_db_data:
    driver: local
